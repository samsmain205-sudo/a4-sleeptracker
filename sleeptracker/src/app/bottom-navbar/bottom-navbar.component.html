<!-- ICONS from ionic for navbar-->
<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" routerLink="/home" routerDirection="root">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Log Sleep</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="mood" routerLink="/mood" routerDirection="root">
      <ion-icon name="accessibility-outline"></ion-icon>      
      <ion-label>Log Mood</ion-label> 
    </ion-tab-button>

    <ion-tab-button tab="data" routerLink = "/data" routerDirection = "root">
      <ion-icon name="stats-chart-outline"></ion-icon>
      <ion-label>View Data</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
