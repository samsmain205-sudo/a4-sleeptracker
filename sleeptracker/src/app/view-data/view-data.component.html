<ion-header>

    <ion-title class="header">
      BetterSleep
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
     <h1>Logged Data</h1>
 <ion-list>
   @for (entry of allSleepData; track entry.id) {

        </ion-label>
      </ion-item> 
    x }
  </ion-list>
</ion-content>
