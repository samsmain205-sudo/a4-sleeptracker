
<!-- Top part of APP -->
<ion-header>
  <ion-toolbar>
    <ion-title class = "header">
      BetterSleep
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class = "inner-text">
  <!-- Makes logo with text side to side-->
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-img class = "logo"
          src="assets/Logo.png"
          alt="Cat laying on a moon logo"
        ></ion-img>
        </ion-col>
      <ion-col>
        <ion-text class = "quote"> "Discover the great ideas that lie 
          inside you by discovering the power of sleep" <br>- Arianna Huffington
        </ion-text>

      </ion-col>
    </ion-row>
  </ion-grid>

  <h1 class = "heading1">
     Log Overnight Sleep
  </h1>


  <div class="sleep-field">
  <h2>Went to Bed</h2>
  <ion-datetime-button datetime="bedtimePicker"></ion-datetime-button>
</div>

<div class="sleep-field">
  <h2>Woke Up</h2>
  <ion-datetime-button datetime="wakeupPicker"></ion-datetime-button>
</div>


  <ion-button class="ion-margin-top" shape = "round" (click)="logSleep()">
    Save Sleep Log
  </ion-button>
</ion-content>

<!-- send back user input and keepContentsMounted to render UI immediatly  -->
<ion-modal [keepContentsMounted] = "true">
    <ng-template>
      <ion-datetime
        id="bedtimePicker"
        presentation="date-time"
        [(ngModel)]="sleepStartISO">
      </ion-datetime>
    </ng-template>
</ion-modal>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime
        id="wakeupPicker"
        presentation="date-time"
        [(ngModel)]="sleepEndISO">
      </ion-datetime>
    </ng-template>
  </ion-modal>
